name: G29 PS4 firmware build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-g29-ps4:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes make gcc-avr avr-libc binutils-avr
      - name: Build EMUG29PS4
        run: make -C EMUG29PS4 clean all
